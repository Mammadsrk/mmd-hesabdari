    <!-- Center Coin -->
    <circle cx="256" cy="270" r="48" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
    <text x="256" y="284" font-size="42" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">﷼</text>
